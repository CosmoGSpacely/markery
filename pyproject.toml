[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markery"
version = "0.3.2"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "requests>=2.25.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
markery = "markery.cli:main"

[project.optional-dependencies]
enhance = [
    "opencv-python-headless>=4.8.0",
    "vtracer>=0.6.0",
    "numpy>=1.24",
]
librarian = [
    "sentence-transformers>=2.2",
]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0", "responses>=0.25.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dataqa: real-corpus data-validation tests; require committed data/ or library/ and are excluded from the hermetic CI lane (run with -m dataqa).",
]
