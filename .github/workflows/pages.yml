name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Build sites
        run: markery site build information-systems --base-url https://cosmogspacely.github.io/markery

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/information-systems
          cp -r projects/information-systems/site/. deploy/information-systems/
          cp .github/pages-index.html deploy/index.html

      - name: Push to gh-pages
        run: |
          cd deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
