name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test — hermetic lane (with coverage)
        run: python -m pytest -q -m "not dataqa" --cov=markery --cov-report=term-missing:skip-covered --cov-fail-under=65

  dataqa:
    # Optional real-corpus data-validation lane: the @pytest.mark.dataqa tests
    # against the committed data/ and library/. Kept separate from the hermetic
    # `test` job so the latter proves the machinery works for any data, not that
    # one committed corpus happens to be well-formed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Data-QA lane
        run: python -m pytest -q -m dataqa

  mvo:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        model:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: MVO contracts (${{ matrix.model }})
        env:
          MARKERY_MODEL: ${{ matrix.model }}
        run: python -m pytest tests/test_mvo.py tests/test_contract.py -v
